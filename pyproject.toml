[project]
name = "mlops-labs"
version = "0.1.0"
description = "Лабораторные работы курса «Технологии MLOps», вариант 2 — Wine Quality"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "dvc[s3]>=3.55",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]     # в ноутбуке есть команды оболочки

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
